services:
  traefik:
    image: traefik:v3.2
    container_name: paasdeploy-traefik
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-contato@connexto.com.br}
    ports:
      - "80:80"
      - "443:443"
      - "50051:50051"
      - "8081:8081"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - traefik-logs:/var/log/traefik
      - traefik-certs:/etc/traefik
    networks:
      - paasdeploy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.entrypoints=traefik"

  postgres:
    image: postgres:16-alpine
    container_name: paasdeploy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-paasdeploy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-paasdeploy}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - paasdeploy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paasdeploy}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    container_name: paasdeploy-backend
    restart: unless-stopped
    env_file:
      - ../apps/backend/.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - deploy-data:/data/apps
      - buildkit-cache:/var/cache/paasdeploy/buildkit
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - paasdeploy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`localhost`) && (PathPrefix(`/api`) || PathPrefix(`/events`) || PathPrefix(`/health`))"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"
      - "traefik.tcp.routers.backend-grpc.rule=HostSNI(`*`)"
      - "traefik.tcp.routers.backend-grpc.entrypoints=grpc"
      - "traefik.tcp.routers.backend-grpc.service=backend-grpc"
      - "traefik.tcp.routers.backend-grpc.tls.passthrough=true"
      - "traefik.tcp.services.backend-grpc.loadbalancer.server.port=50051"

  frontend:
    build:
      context: ../apps/frontend
      dockerfile: Dockerfile
    container_name: paasdeploy-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - paasdeploy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`localhost`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

  mcp:
    build:
      context: ..
      dockerfile: apps/mcp/Dockerfile
    container_name: flowdeploy-mcp
    restart: unless-stopped
    environment:
      FLOWDEPLOY_BACKEND_URL: ${FLOWDEPLOY_BACKEND_URL:-http://backend:8080}
      FLOWDEPLOY_LOG_LEVEL: ${FLOWDEPLOY_MCP_LOG_LEVEL:-info}
    command:
      - "serve"
      - "--addr=:3001"
      - "--allowed-clients=${FLOWDEPLOY_MCP_ALLOWED_CLIENTS:-cursor,claude-desktop,custom:*,ci:*}"
      - "--read-rpm=${FLOWDEPLOY_MCP_READ_RPM:-120}"
      - "--mutate-rpm=${FLOWDEPLOY_MCP_MUTATE_RPM:-20}"
    depends_on:
      backend:
        condition: service_started
    networks:
      - paasdeploy
    labels:
      - "traefik.enable=true"
      # Public router: exposes ONLY the JSON-RPC + SSE endpoint at /mcp.
      # Internal endpoints (/metrics, /healthz, /readyz) stay reachable from
      # inside the paasdeploy network for Prometheus / docker healthcheck only.
      - "traefik.http.routers.mcp.rule=Host(`${MCP_HOST:-mcp.localhost}`) && PathPrefix(`/mcp`)"
      - "traefik.http.routers.mcp.entrypoints=websecure"
      - "traefik.http.routers.mcp.tls=true"
      - "traefik.http.routers.mcp.tls.certresolver=letsencrypt"
      - "traefik.http.services.mcp.loadbalancer.server.port=3001"
      - "traefik.http.middlewares.mcp-headers.headers.customResponseHeaders.X-Content-Type-Options=nosniff"
      - "traefik.http.middlewares.mcp-headers.headers.customResponseHeaders.Strict-Transport-Security=max-age=63072000; includeSubDomains"
      - "traefik.http.routers.mcp.middlewares=mcp-headers@docker"

networks:
  paasdeploy:
    external: true

volumes:
  postgres-data:
  deploy-data:
  traefik-logs:
  traefik-certs:
  buildkit-cache:
