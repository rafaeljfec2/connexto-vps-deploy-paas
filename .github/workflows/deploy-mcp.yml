name: Deploy MCP Server to Production

on:
  push:
    branches:
      - main
    paths:
      - "apps/mcp/**"
      - "deploy/docker-compose.yml"
      - ".github/workflows/deploy-mcp.yml"
      - ".github/scripts/deploy-mcp.sh"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-mcp-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-mcp
  CONTAINER_NAME: flowdeploy-mcp
  TRAEFIK_NETWORK: paasdeploy

jobs:
  validate-environment:
    runs-on: ubuntu-latest
    environment: Prod
    steps:
      - name: Validate required GitHub Vars/Secrets
        run: |
          echo "Validating required GitHub-side configuration..."
          missing=()
          [ -z "$GHCR_USER" ]                       && missing+=("vars.GHCR_USER (or repo owner fallback)")
          [ -z "$GHCR_TOKEN" ]                      && missing+=("secrets.GHCR_PAT or GITHUB_TOKEN")
          [ -z "$MCP_HOST" ]                        && missing+=("vars.MCP_HOST")
          [ -z "$FLOWDEPLOY_BACKEND_URL" ]          && missing+=("vars.FLOWDEPLOY_BACKEND_URL")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing:"
            printf '  - %s\n' "${missing[@]}"
            echo ""
            echo "Add the missing items in: GitHub -> Settings -> Environments -> Prod -> Variables/Secrets"
            exit 1
          fi
          echo "OK"
          echo "  MCP_HOST=${MCP_HOST}"
          echo "  FLOWDEPLOY_BACKEND_URL=${FLOWDEPLOY_BACKEND_URL}"
          echo "  FLOWDEPLOY_MCP_ALLOWED_CLIENTS=${FLOWDEPLOY_MCP_ALLOWED_CLIENTS:-(default in script)}"
          echo "  FLOWDEPLOY_MCP_READ_RPM=${FLOWDEPLOY_MCP_READ_RPM:-120 (default)}"
          echo "  FLOWDEPLOY_MCP_MUTATE_RPM=${FLOWDEPLOY_MCP_MUTATE_RPM:-20 (default)}"
          echo "  FLOWDEPLOY_MCP_SESSION_MAX_AGE=${FLOWDEPLOY_MCP_SESSION_MAX_AGE:-30m (default)}"
        env:
          GHCR_USER: ${{ vars.GHCR_USER || github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
          MCP_HOST: ${{ vars.MCP_HOST }}
          FLOWDEPLOY_BACKEND_URL: ${{ vars.FLOWDEPLOY_BACKEND_URL }}
          FLOWDEPLOY_MCP_ALLOWED_CLIENTS: ${{ vars.FLOWDEPLOY_MCP_ALLOWED_CLIENTS }}
          FLOWDEPLOY_MCP_READ_RPM: ${{ vars.FLOWDEPLOY_MCP_READ_RPM }}
          FLOWDEPLOY_MCP_MUTATE_RPM: ${{ vars.FLOWDEPLOY_MCP_MUTATE_RPM }}
          FLOWDEPLOY_MCP_SESSION_MAX_AGE: ${{ vars.FLOWDEPLOY_MCP_SESSION_MAX_AGE }}

  build-and-push:
    needs: validate-environment
    runs-on: ubuntu-latest
    environment: Prod
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.get-version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: get-version
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          # Match the tag emitted by docker/metadata-action (default prefix 'sha-').
          IMAGE_TAG="sha-${SHORT_SHA}"
          echo "version=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "Image tag: ${IMAGE_TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/mcp/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,mode=max,scope=mcp

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, flowdeploy-control-plane]
    environment: Prod
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run deploy script
        run: |
          chmod +x .github/scripts/deploy-mcp.sh
          .github/scripts/deploy-mcp.sh
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          GHCR_USER: ${{ vars.GHCR_USER || github.repository_owner }}
          GHCR_PAT: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
          TRAEFIK_NETWORK: ${{ env.TRAEFIK_NETWORK }}
          MCP_HOST: ${{ vars.MCP_HOST }}
          FLOWDEPLOY_BACKEND_URL: ${{ vars.FLOWDEPLOY_BACKEND_URL }}
          FLOWDEPLOY_MCP_LOG_LEVEL: ${{ vars.FLOWDEPLOY_MCP_LOG_LEVEL || 'info' }}
          FLOWDEPLOY_MCP_ALLOWED_CLIENTS: ${{ vars.FLOWDEPLOY_MCP_ALLOWED_CLIENTS || 'cursor,claude-desktop,custom:*,ci:*' }}
          FLOWDEPLOY_MCP_READ_RPM: ${{ vars.FLOWDEPLOY_MCP_READ_RPM || '120' }}
          FLOWDEPLOY_MCP_MUTATE_RPM: ${{ vars.FLOWDEPLOY_MCP_MUTATE_RPM || '20' }}
          FLOWDEPLOY_MCP_SESSION_MAX_AGE: ${{ vars.FLOWDEPLOY_MCP_SESSION_MAX_AGE || '30m' }}

      - name: Smoke test public endpoint
        # Issue an unauthenticated POST against /mcp and assert the public
        # entrypoint is reachable AND rejecting requests without a PAT (401).
        # Any other outcome (timeout, 5xx, 200, missing TLS) means the deploy
        # cannot serve traffic and we MUST fail the pipeline.
        # Allow up to 60s for Let's Encrypt cert hand-off + Traefik reload.
        run: |
          set -euo pipefail
          MCP_URL="https://${{ vars.MCP_HOST }}/mcp"
          echo "Probing ${MCP_URL}"
          status="000"
          for attempt in $(seq 1 12); do
            status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 -X POST "${MCP_URL}" || echo "000")
            if [ "${status}" = "401" ]; then
              echo "OK: /mcp is reachable and correctly rejecting unauth requests (HTTP 401)"
              exit 0
            fi
            echo "  attempt ${attempt}: got HTTP ${status}, retrying in 5s..."
            sleep 5
          done
          echo "ERROR: /mcp did not reach a healthy state within 60s (last status: ${status})"
          exit 1

      - name: Verify deployment
        if: success()
        run: |
          echo "Container : ${{ env.CONTAINER_NAME }}"
          echo "Image     : ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image_tag }} (also tagged :latest)"
          echo "Public URL: https://${{ vars.MCP_HOST }}/mcp"
          echo ""
          echo "Next steps:"
          echo "  1. Generate a PAT in the dashboard"
          echo "  2. Configure ~/.cursor/mcp.json (see docs/MCP_CLIENT_SETUP.md)"
