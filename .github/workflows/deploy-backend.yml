name: Deploy Backend to Production

on:
  push:
    branches:
      - main
    paths:
      - "apps/backend/**"
      - "apps/agent/**"
      - "apps/proto/**"
      - ".github/workflows/deploy-backend.yml"
      - ".github/scripts/**"
      - "AGENT_VERSION"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-backend-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-backend
  CONTAINER_NAME: flowdeploy-backend
  API_DOMAIN: api-deploy.connexto.com.br
  TRAEFIK_NETWORK: paasdeploy

jobs:
  validate-environment:
    runs-on: ubuntu-latest
    environment: Prod
    steps:
      - name: Validate required GitHub Vars/Secrets
        run: |
          echo "Validating required GitHub-side configuration..."
          missing=()
          [ -z "$GHCR_USER" ]      && missing+=("vars.GHCR_USER (or repo owner fallback)")
          [ -z "$GHCR_TOKEN" ]     && missing+=("secrets.GHCR_PAT or GITHUB_TOKEN")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing:"
            printf '  - %s\n' "${missing[@]}"
            exit 1
          fi
          echo "OK"
        env:
          GHCR_USER: ${{ vars.GHCR_USER || github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

  build-and-push:
    needs: validate-environment
    runs-on: ubuntu-latest
    environment: Prod
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.get-version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: get-version
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          # Match the tag emitted by docker/metadata-action (default prefix 'sha-').
          IMAGE_TAG="sha-${SHORT_SHA}"
          echo "version=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "Image tag: ${IMAGE_TAG}"

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, flowdeploy-control-plane]
    environment: Prod
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run deploy script
        run: |
          chmod +x .github/scripts/deploy.sh
          .github/scripts/deploy.sh
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          GHCR_USER: ${{ vars.GHCR_USER || github.repository_owner }}
          GHCR_PAT: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
          TRAEFIK_NETWORK: ${{ env.TRAEFIK_NETWORK }}
          API_DOMAIN: ${{ env.API_DOMAIN }}

      - name: Verify deployment
        run: |
          echo "Container: ${{ env.CONTAINER_NAME }}"
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image_tag }} (also tagged :latest)"
          echo "API URL: https://${{ env.API_DOMAIN }}"
